<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shane Wilson - Portfolio</title>
    <!-- GSAP for smooth cinematic transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden !important; 
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        /* UNIFIED SINGLE SIDEBAR (60px wide) */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            z-index: 1000;
        }

        .sidebar-brand {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            cursor: pointer;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .sidebar-brand:hover {
            opacity: 0.7;
        }

        .sidebar-brand span {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.2s ease;
        }
        
        .sidebar-brand.active span {
            color: #38bdf8;
        }

        /* SIDEBAR CENTER SECTION TITLE */
        .sidebar-center-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-center-title.visible {
            opacity: 1;
        }

        .sidebar-center-title span {
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .sidebar-nav-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .nav-item {
            cursor: pointer;
            padding: 4px 0;
            transition: opacity 0.2s ease;
        }

        .nav-item:hover {
            opacity: 0.7;
        }

        .nav-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #777;
            font-weight: 500;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        .nav-item:hover .nav-text,
        .nav-item.active .nav-text {
            color: #38bdf8;
        }

        /* Main Content Layout */
        .main-content {
            margin-left: 60px;
            width: calc(100vw - 60px);
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Views System */
        .view {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .view.active {
            display: block;
        }

        .view.splash-view {
            height: 100%;
            overflow: hidden;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background: #000;
        }

        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Editorial Full-Height Vertical Strips */
        .editorial-strip-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0b0b;
        }

        .editorial-strip {
            flex: 1 1 0;
            min-width: 0; 
            height: 100%;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            transition: flex 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 769px) {
            .editorial-strip:hover {
                flex: 3 1 0;
            }
        }

        .editorial-strip video, 
        .editorial-strip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scale(1.05); 
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 769px) {
            .editorial-strip:hover video,
            .editorial-strip:hover img {
                transform: scale(1.07);
            }
        }

        .strip-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 35px 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        @media (min-width: 769px) {
            .editorial-strip:hover .strip-caption {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .strip-number {
            font-family: "Didot", "Bodoni MT", "Times New Roman", Times, serif;
            font-size: 2.4rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 1px;
            color: #38bdf8;
            margin-bottom: 2px;
            line-height: 1;
        }

        .strip-caption h3 {
            font-size: 1.05rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 6px;
        }

        .strip-caption p {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #888;
        }

        /* Detail Views */
        .detail-view-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background: #000;
            position: relative;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        .detail-view-container::-webkit-scrollbar { display: none; }

        /* FLOATING PAGE HEADER (TOP LEFT) */
        .project-floating-header {
            position: fixed;
            top: 30px;
            left: 90px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            width: 320px;
            max-height: calc(100vh - 60px);
            transition: opacity 0.3s ease;
        }
        .project-floating-header h2 {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .project-floating-subtitle {
            font-size: 0.72rem;
            letter-spacing: 0.3px;
            color: #aaa;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            line-height: 1.35;
        }
        .project-floating-header.has-subtitle:hover .project-floating-subtitle {
            max-height: 80vh;
            opacity: 1;
            margin-top: 8px;
            overflow-y: auto;
        }

        /* PAGE & COLUMN ANNOTATIONS */
        .page-annotation {
            position: absolute;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            color: #fff;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 320px;
            max-width: calc(100% - 60px);
            max-height: calc(100vh - 80px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .grid-page.light-mode .page-annotation {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #000;
        }
        
        .page-annotation.has-description { cursor: pointer; }
        .page-annotation.align-right { right: 30px; left: auto; align-items: flex-end; text-align: right; }
        .page-annotation.align-left { left: 30px; right: auto; align-items: flex-start; text-align: left; }
        .page-annotation.align-center { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); }
        .page-annotation.align-center .annotation-title-wrapper { justify-content: center; }
        .page-annotation.align-top { top: 30px; bottom: auto; }
        .page-annotation.align-bottom { bottom: 30px; top: auto; }
        
        .annotation-title-wrapper { width: 100%; display: flex; align-items: center; }
        .page-annotation.align-right .annotation-title-wrapper { justify-content: flex-end; }
        .page-annotation.align-left .annotation-title-wrapper { justify-content: flex-start; }

        .annotation-title {
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            transition: white-space 0.3s;
        }
        
        .expand-icon { margin-left: 8px; margin-right: 8px; font-size: 14px; color: #888; transition: transform 0.3s ease; }

        .annotation-description {
            font-size: 0.7rem; letter-spacing: 0.5px; color: #bbb; line-height: 1.45;
            max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); width: 100%;
        }
        .grid-page.light-mode .annotation-description { color: #555; }

        .page-annotation.has-description:hover .annotation-description,
        .page-annotation.has-description.expanded .annotation-description { 
            max-height: 70vh; 
            opacity: 1; 
            margin-top: 10px; 
            overflow-y: auto; 
        }
        .page-annotation.has-description:hover .expand-icon,
        .page-annotation.has-description.expanded .expand-icon { transform: rotate(45deg); }
        .page-annotation.has-description:hover .annotation-title,
        .page-annotation.has-description.expanded .annotation-title { white-space: normal; }

        /* Dark mode scrollable rows */
        .detail-view-container > .project-row,
        .grid-page > .project-row {
            display: flex;
            width: 100%;
            height: 100%;
            flex: 0 0 100%;
            background: #000;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            min-height: 0;
        }

        .project-media-box {
            flex: 1 1 0;
            min-width: 0;
            min-height: 0;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .project-media-box.framed { background: #050505; }
        .media-frame-inner {
            position: absolute;
            top: 30px; bottom: 30px; left: 30px; right: 30px;
            overflow: hidden; background: #000;
        }
        .media-frame-inner video,
        .media-frame-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .media-frame-inner.contain-fit video,
        .media-frame-inner.contain-fit img { object-fit: contain; }

        .project-media-box > video,
        .project-media-box > img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transform: scale(1.05); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* GRID STYLES FOR INNER COLUMNS */
        .project-media-box > .nested-grid {
            width: 100%; height: 100%; display: grid; gap: 0; overflow: hidden; 
            transform: scale(1.05); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .nested-grid .grid-cell {
            width: 100%; height: 100%; overflow: hidden; min-height: 0; min-width: 0;
            display: flex; align-items: center; justify-content: center; position: relative;
        }

        .nested-grid .grid-cell.framed { background: #050505; }

        .nested-grid img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 0; min-width: 0; }
        
        .project-row.horizontal-only .project-media-box > .nested-grid { height: 100% !important; width: 100% !important; transform: none !important; }

        .project-row.horizontal-only .project-media-box > img,
        .project-row.horizontal-only .project-media-box > video {
            height: 100% !important; width: auto !important; max-width: none !important; object-fit: cover; transform: none !important; 
        }

        /* Pages (Dark & Light Mode) */
        .grid-page {
            display: flex; flex-direction: column; width: 100%; height: 100%; position: relative;
            scroll-snap-align: start; scroll-snap-stop: always; background: #000; color: #ffffff; overflow: hidden; flex-shrink: 0;
        }
        .grid-page.light-mode { background: #ffffff; color: #000000; padding-top: 75px; padding-bottom: 75px; }
        .grid-page.light-mode .project-row {
            display: flex; width: 100%; flex: 1 1 0; min-height: 0; height: auto; background: #ffffff; border-bottom: none; overflow: hidden; position: relative;
        }
        .grid-page.light-mode .project-media-box { background: #ffffff; min-height: 0; border-right: none; padding: 4px; }
        .grid-page.light-mode .project-media-box img,
        .grid-page.light-mode .project-media-box video {
            width: 100% !important; height: 100% !important; max-width: 100%; max-height: 100%; object-fit: contain !important; transform: none !important;
        }
        .grid-page.light-mode .project-media-box:hover { z-index: 10; }

        /* AUDIO PLAYER OVERLAY */
        .audio-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: background 0.4s ease;
        }
        
        .audio-overlay:hover {
            background: rgba(0, 0, 0, 0.45);
        }

        .audio-overlay.is-playing {
            background: rgba(0, 0, 0, 0.2);
        }

        .audio-play-btn {
            width: 70px; height: 70px;
            border-radius: 50% !important;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .audio-overlay:hover .audio-play-btn {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .play-icon {
            width: 0; height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid #fff;
            margin-left: 4px;
        }

        .pause-icon {
            display: flex; gap: 5px;
        }
        .pause-icon div {
            width: 4px; height: 18px; background: #fff;
        }

        /* Contact View Styles */
        .contact-container {
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0b0b;
        }
        .contact-container p { color: #888; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 15px; }
        .contact-container a {
            color: #38bdf8; text-decoration: none; font-size: 1.8rem; letter-spacing: 1px;
            font-family: "Didot", "Bodoni MT", "Times New Roman", Times, serif; font-style: italic; transition: opacity 0.3s ease;
        }
        .contact-container a:hover { opacity: 0.7; }

        /* Mobile Adaptations */
        @media (max-width: 768px) {
            html, body { width: 100vw; height: 100%; overflow: hidden; }
            .sidebar {
                position: fixed; top: 0; left: 0; width: 100vw; height: 60px;
                display: flex; flex-direction: row; align-items: center; justify-content: space-between;
                padding: 0 20px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.08); z-index: 2000;
                background-color: rgba(10, 10, 10, 0.98); overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap;
            }
            .sidebar::-webkit-scrollbar { display: none; }
            
            .sidebar-brand { writing-mode: horizontal-tb !important; transform: none !important; margin-right: 15px; flex-shrink: 0; }
            .sidebar-brand span { writing-mode: horizontal-tb !important; transform: none !important; font-size: 0.75rem; }
            
            .sidebar-center-title {
                writing-mode: horizontal-tb !important;
                transform: none !important;
                margin: 0 10px;
                flex: 1;
                display: flex;
                justify-content: center;
                text-align: center;
                overflow: hidden;
            }
            .sidebar-center-title span {
                writing-mode: horizontal-tb !important;
                transform: none !important;
                font-size: 0.75rem;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .sidebar-nav-stack { display: flex; flex-direction: row; align-items: center; gap: 20px; flex-shrink: 0; }
            .nav-item { flex-shrink: 0; }
            .nav-text { writing-mode: horizontal-tb !important; transform: none !important; font-size: 0.75rem; }

            .main-content {
                margin-left: 0; margin-top: 60px; width: 100vw; height: calc(100vh - 60px); height: calc(100dvh - 60px); position: relative; overflow: hidden; 
            }
            
            .view, .view.splash-view, .splash-container { width: 100vw; height: 100%; position: absolute; top: 0; left: 0; }
            
            .project-floating-header { 
                top: 70px; 
                left: 12px; 
                width: calc(100vw - 24px); 
                max-width: 300px;
                padding: 8px 14px; 
                z-index: 150;
            }
            
            .editorial-strip-container { flex-direction: column; height: 100%; overflow-x: hidden; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; }
            .editorial-strip { flex: 0 0 100%; width: 100vw; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
            
            .strip-caption {
                opacity: 1; transform: translateY(0); padding: 20px 20px 25px 20px;
                background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, transparent); bottom: 0;
            }
            
            .detail-view-container {
                scroll-snap-type: y mandatory;
                -webkit-overflow-scrolling: touch;
            }

            /* --- 1. DEFAULT MOBILE LAYOUT (Animation, Trims, etc.) --- */
            
            /* FIX: Mobile browsers break scroll-snapping on deeply nested flex elements. 
               Flattening these wrappers to block ensures native snap targets pass through accurately. */
            .grid-page {
                display: block !important; 
                width: 100vw !important; 
                height: auto !important;
                overflow: visible !important; 
            }

            .detail-view-container > .project-row,
            .grid-page > .project-row { 
                display: block !important; 
                width: 100vw !important; 
                height: auto !important; 
                scroll-snap-align: none !important; 
                overflow: visible !important; 
            }

            /* Snaps cleanly to each image/video, forcing it to fill the entire mobile view height */
            .detail-view-container .project-media-box, 
            .detail-view-container .project-media-box.framed {
                display: flex !important; /* Keep internal contents centered */
                width: 100vw !important; 
                height: calc(100dvh - 60px) !important;
                scroll-snap-align: start !important; 
                scroll-snap-stop: always !important; 
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                border-right: none !important;
                box-sizing: border-box;
            }

            .detail-view-container .project-media-box > img,
            .detail-view-container .project-media-box > video { width: 100% !important; height: 100% !important; object-fit: cover !important; }


            /* --- 2. EMBROIDERY-SPECIFIC MOBILE OVERRIDE --- */
            /* Restores flex row functionality strictly for the Embroidery page's side-by-side layout */
            .detail-view-container[data-project-id="Embroidery"] > .project-row,
            .detail-view-container[data-project-id="Embroidery"] .grid-page > .project-row { 
                display: flex !important; 
                flex-direction: row !important; 
                flex-wrap: nowrap !important; 
                height: calc(100dvh - 60px) !important; 
                scroll-snap-align: start !important; 
                scroll-snap-stop: always !important; 
                overflow: hidden !important;
            }

            .detail-view-container[data-project-id="Embroidery"] .project-media-box,
            .detail-view-container[data-project-id="Embroidery"] .project-media-box.framed {
                width: 50vw !important; 
                flex: 0 0 50vw !important;
                height: calc(100dvh - 60px) !important;
                scroll-snap-align: none !important; /* The parent row handles snapping here */
                border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
            }

            .detail-view-container[data-project-id="Embroidery"] .project-media-box:nth-child(even) {
                border-right: none !important;
            }


            /* General Mobile Formatting */
            .page-annotation { 
                width: calc(100% - 16px) !important; 
                bottom: 12px !important; 
                left: 8px !important; 
                right: auto !important; 
                transform: none !important;
                padding: 8px 10px !important; 
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                box-sizing: border-box !important;
            }

            .page-annotation .annotation-title-wrapper {
                width: 100% !important;
                justify-content: center !important;
            }

            .annotation-title {
                white-space: normal !important; 
                word-wrap: break-word !important;
                text-align: center !important;
                font-size: 0.7rem !important;
                line-height: 1.2 !important;
                text-overflow: clip !important;
            }
            
            .grid-page.light-mode {
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                background: #ffffff;
            }
            
            .grid-page.light-mode .project-media-box:not(.mobile-feature),
            .grid-page:has(.mobile-feature) .project-media-box:not(.mobile-feature) { display: none !important; }
            
            /* Keeps mobile features like VIP Illustrations standard (100vw wide, full-screen height) */
            .grid-page.light-mode .project-media-box.mobile-feature,
            .grid-page:has(.mobile-feature) .project-media-box.mobile-feature {
                width: 100vw !important; flex: 0 0 100vw !important; height: calc(100dvh - 60px) !important; border: none !important; border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important; border-right: none !important; padding: 10px !important; scroll-snap-align: start !important;
            }

            .grid-page.light-mode .project-media-box img,
            .grid-page.light-mode .project-media-box video,
            .grid-page:has(.mobile-feature) .project-media-box img,
            .grid-page:has(.mobile-feature) .project-media-box video { object-fit: contain !important; }
            
            .contact-container a { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand active" onclick="filterStrips('all', this)">
            <span>Shane Wilson</span>
        </div>

        function renderEditorialStrips(filterCategory = 'all') {
            const container = document.getElementById('editorialContainer');
            container.innerHTML = '';

            let counter = 1;
            projects.forEach(project => {
                if (filterCategory === 'all' || project.categories.includes(filterCategory)) {
                    const strip = document.createElement('div');
                    strip.className = 'editorial-strip';
                    strip.setAttribute('data-category', project.categories.join(' '));
                    strip.onclick = () => openProject(project.id);

                    const styleAttr = project.thumbPosition ? `style="object-position: ${project.thumbPosition};"` : '';
                    const mediaElement = project.thumbIsVideo
                        ? `<video src="${project.thumbSrc}" autoplay loop muted playsinline></video>`
                        : `<img src="${project.thumbSrc}" alt="${project.title}" ${styleAttr}>`;

                    const formattedNum = String(counter).padStart(2, '0');

                    strip.innerHTML = `
                        ${mediaElement}
                        <div class="strip-caption">
                            <h4 class="strip-number">${formattedNum}</h4>
                            <h3>${project.title}</h3>
                            <p>${project.subtitle}</p>
                        </div>
                    `;
                    container.appendChild(strip);
                    counter++;
                }
            });
        }

        function makeInertialScrollable(container) {
            if (!container || container._hasInertial) return;
            container._hasInertial = true;

            let targetScroll = 0;
            let currentScroll = 0;
            let isScrolling = false;

            container.addEventListener('wheel', (evt) => {
                if (!document.body.contains(container)) return;

                if (window.innerWidth > 768 && (evt.deltaX !== 0 || evt.deltaY !== 0)) {
                    if (Math.abs(container.scrollLeft - currentScroll) > 5) {
                        targetScroll = container.scrollLeft;
                        currentScroll = container.scrollLeft;
                    }

                    evt.preventDefault();
                    
                    const scrollDelta = evt.deltaX !== 0 ? evt.deltaX : evt.deltaY;
                    targetScroll += scrollDelta * 0.8;
                    targetScroll = Math.max(0, Math.min(targetScroll, container.scrollWidth - container.clientWidth));

                    if (!isScrolling) {
                        isScrolling = true;
                        requestAnimationFrame(updateScroll);
                    }
                }
            }, { passive: false });

            function updateScroll() {
                if (!document.body.contains(container)) {
                    isScrolling = false;
                    return; 
                }

                currentScroll += (targetScroll - currentScroll) * 0.08;
                container.scrollLeft = currentScroll;

                if (Math.abs(targetScroll - currentScroll) > 0.3) {
                    requestAnimationFrame(updateScroll);
                } else {
                    isScrolling = false;
                }
            }
        }

        function getSmartPadding(colIndex, rowIndex, totalCols, totalRows, basePadding) {
            if (!basePadding) return '0px';

            const match = String(basePadding).match(/^([\d.]+)(.*)$/);
            if (!match) return basePadding;
            const val = parseFloat(match[1]);
            const unit = match[2];

            const isTop = (rowIndex === 0);
            const isBottom = (rowIndex === totalRows - 1);
            const isLeft = (colIndex === 0);
            const isRight = (colIndex === totalCols - 1);

            let pt = isTop ? val * 2 : val;
            let pr = isRight ? val * 2 : val;
            let pb = isBottom ? val * 2 : val;
            let pl = isLeft ? val * 2 : val;

            return `${pt}${unit} ${pr}${unit} ${pb}${unit} ${pl}${unit}`;
        }

        function updateFloatingHeader(title, description) {
            const headerEl = document.getElementById('projectFloatingHeader');
            const titleEl = document.getElementById('floatingTitle');
            const subtitleEl = document.getElementById('floatingSubtitle');

            if (!headerEl || !titleEl || !subtitleEl) return;

            if (!title) {
                headerEl.style.display = 'none';
                return;
            }

            headerEl.style.display = 'flex';
            titleEl.innerText = title;

            if (description && description.trim() !== '') {
                subtitleEl.innerText = description;
                headerEl.classList.add('has-subtitle');
            } else {
                subtitleEl.innerText = '';
                headerEl.classList.remove('has-subtitle');
            }
        }

        function setupDetailScrollObserver() {
            if (detailObserver) {
                detailObserver.disconnect();
            }

            const container = document.getElementById('detailContainer');
            if (!container) return;

            const elementsToObserve = container.querySelectorAll('.grid-page[data-page-title], .project-row[data-page-title]');
            if (elementsToObserve.length === 0) return;

            let currentKey = '';

            detailObserver = new IntersectionObserver((entries) => {
                let bestEntry = null;
                let maxRatio = 0;

                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.intersectionRatio > maxRatio) {
                        maxRatio = entry.intersectionRatio;
                        bestEntry = entry;
                    }
                });

                if (bestEntry) {
                    const title = bestEntry.target.getAttribute('data-page-title') || '';
                    const desc = bestEntry.target.getAttribute('data-page-description') || '';
                    const key = title + '::' + desc;

                    if (key !== currentKey) {
                        currentKey = key;
                        updateFloatingHeader(title, desc);
                    }
                }
            }, {
                root: container,
                threshold: [0.2, 0.5, 0.8]
            });

            elementsToObserve.forEach(el => {
                detailObserver.observe(el);
            });
        }

        function openProject(projectId) {
            const project = projects.find(p => p.id === projectId) || projects[0];
            activeProject = project;
            
            const centerTitleEl = document.getElementById('sidebarCenterTitle');
            const centerTitleTextEl = document.getElementById('sidebarCenterTitleText');
            if (centerTitleTextEl) centerTitleTextEl.innerText = project.title;
            if (centerTitleEl) centerTitleEl.classList.add('visible');

            const container = document.getElementById('detailContainer');
            container.innerHTML = '';
            container.setAttribute('data-project-id', project.id);
            
            function createAnnotation(title, description, align, position) {
                if (!title && !description) return null;
                const annotation = document.createElement('div');
                const posClass = position === 'top' ? 'align-top' : 'align-bottom';
                
                let alignClass = 'align-left';
                if (align === 'right') alignClass = 'align-right';
                else if (align === 'center') alignClass = 'align-center'; 

                annotation.className = `page-annotation ${posClass} ${alignClass}`;

                let innerHTML = `<div class="annotation-title-wrapper">`;
                if (description && align === 'right') innerHTML += `<span class="expand-icon">+</span>`;
                if (title) innerHTML += `<span class="annotation-title">${title}</span>`;
                if (description && align !== 'right') innerHTML += `<span class="expand-icon">+</span>`;
                innerHTML += `</div>`;

                if (description) {
                    annotation.classList.add('has-description');
                    innerHTML += `<div class="annotation-description">${description}</div>`;
                    
                    annotation.addEventListener('click', function(e) {
                        e.stopPropagation();
                        this.classList.toggle('expanded');
                    });
                }
                annotation.innerHTML = innerHTML;
                return annotation;
            }

            let activePages = project.pages;
            if (!activePages && project.rows) {
                activePages = [{ rows: project.rows, isVirtual: true }];
            }

            // --- MOBILE PRE-PROCESSOR CHUNKING & ALTERNATING SYSTEM ---
            // Strictly isolated to the "Embroidery" project so other projects are bypassed.
            let processedPages = JSON.parse(JSON.stringify(activePages)); 

            if (window.innerWidth <= 768) {
                processedPages.forEach(page => {
                    let newRows = [];
                    for(let i = 0; i < page.rows.length; i++) {
                        let r = page.rows[i];
                        
                        if (project.id === 'Embroidery') {
                            if (r.pageTitle && i + 1 < page.rows.length && page.rows[i+1].pageTitle === r.pageTitle) {
                                let nextR = page.rows[i+1];
                                let mergedCols = [];
                                let maxLen = Math.max(r.cols.length, nextR.cols.length);
                                for(let j = 0; j < maxLen; j++) {
                                    if (j < r.cols.length) mergedCols.push(r.cols[j]);
                                    if (j < nextR.cols.length) mergedCols.push(nextR.cols[j]);
                                }
                                r.cols = mergedCols;
                                i++; 
                            }
                            
                            let chunkIndex = 0;
                            for (let k = 0; k < r.cols.length; k += 2) {
                                let chunk = r.cols.slice(k, k + 2);
                                
                                // ALTERNATING LOGIC: Flips every 2nd row for the checkerboard effect
                                if (chunkIndex % 2 === 1 && chunk.length === 2) {
                                    chunk = [chunk[1], chunk[0]];
                                }
                                
                                let newRow = Object.assign({}, r, { cols: chunk });
                                newRows.push(newRow);
                                chunkIndex++;
                            }
                        } else {
                            // If it's NOT embroidery, leave it completely untouched
                            newRows.push(r);
                        }
                    }
                    page.rows = newRows;
                });
            }

            let firstPageTitle = '';
            let firstPageDesc = '';

            if (processedPages) {
                processedPages.forEach(page => {
                    let targetContainer = container;

                    if (!page.isVirtual) {
                        const pageWrapper = document.createElement('div');
                        pageWrapper.className = 'grid-page' + (page.lightBg ? ' light-mode' : '');
                        
                        const pTitle = page.pageTitle || project.title;
                        const pDesc = page.pageDescription !== undefined ? page.pageDescription : (pTitle === project.title ? project.subtitle : '');
                        pageWrapper.setAttribute('data-page-title', pTitle);
                        pageWrapper.setAttribute('data-page-description', pDesc);

                        if (!firstPageTitle) {
                            firstPageTitle = pTitle;
                            firstPageDesc = pDesc;
                        }
                        
                        container.appendChild(pageWrapper);
                        targetContainer = pageWrapper;
                    }

                    let lastKnownTitleDescMap = {};
                    page.rows.forEach(r => {
                        if (r.pageTitle && r.pageDescription !== undefined) {
                            lastKnownTitleDescMap[r.pageTitle] = r.pageDescription;
                        }
                    });
                    
                    page.rows.forEach(rowObj => {
                        const row = document.createElement('div');
                        let isExpandable = rowObj.expandable === true || rowObj.expandable === 'both' || rowObj.expandable === 'horizontal' || rowObj.expandable === 'sawtooth';
                        let isHorizontalOnly = rowObj.expandable === 'horizontal';
                        let isSawtoothRow = rowObj.expandable === 'sawtooth';

                        row.className = 'project-row' 
                            + (isExpandable ? ' expandable' : '') 
                            + (isHorizontalOnly ? ' horizontal-only' : '')
                            + (isSawtoothRow ? ' sawtooth-row' : '');

                        const rTitle = rowObj.pageTitle || page.pageTitle || project.title;
                        
                        let rDesc = '';
                        if (rowObj.pageDescription !== undefined) {
                            rDesc = rowObj.pageDescription;
                        } else if (lastKnownTitleDescMap[rTitle] !== undefined) {
                            rDesc = lastKnownTitleDescMap[rTitle];
                        } else if (page.pageDescription !== undefined) {
                            rDesc = page.pageDescription;
                        } else if (rTitle === project.title) {
                            rDesc = project.subtitle || '';
                        }

                        row.setAttribute('data-page-title', rTitle);
                        row.setAttribute('data-page-description', rDesc);

                        if (!firstPageTitle) {
                            firstPageTitle = rTitle;
                            firstPageDesc = rDesc;
                        }
                        
                        rowObj.cols.forEach(col => {
                            const box = document.createElement('div');
                            box.className = `project-media-box ${col.framed ? 'framed' : ''}`;
                            if (col.mobileFeature) box.classList.add('mobile-feature');

                            if (col.type === 'grid' || col.group) {
                                box.classList.add('grid-column');
                                let sourceArray = col.type === 'grid' ? col.images : col.group;
                                let totalCols = col.gridCols || sourceArray.length;
                                let totalRows = col.gridRows || Math.ceil(sourceArray.length / totalCols);
                                
                                let gridHtml = `<div class="nested-grid" style="grid-template-columns: repeat(${totalCols}, 1fr); grid-template-rows: repeat(${totalRows}, 1fr);">`;
                                
                                sourceArray.forEach((item, index) => {
                                    let imgSrc = typeof item === 'string' ? item : item.src;
                                    let isVid = typeof item === 'object' ? item.isVideo : false;
                                    let isFramed = typeof item === 'object' ? item.framed : false;
                                    let basePadding = typeof item === 'object' ? item.cellPadding : '0px';
                                    
                                    let rowIndex = Math.floor(index / totalCols);
                                    let colIndex = index % totalCols;
                                    let smartPadding = getSmartPadding(colIndex, rowIndex, totalCols, totalRows, basePadding);
                                    
                                    let mediaTag = isVid 
                                        ? `<video src="${imgSrc}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>`
                                        : `<img src="${imgSrc}" alt="Grid Image" style="width:100%; height:100%; object-fit:cover;">`;
                                    
                                    if (isFramed) {
                                        mediaTag = `<div class="media-frame-inner" style="top:15px; bottom:15px; left:15px; right:15px;">${mediaTag}</div>`;
                                    }
                                        
                                    gridHtml += `<div class="grid-cell ${isFramed ? 'framed' : ''}" style="padding: ${smartPadding};">${mediaTag}</div>`;
                                });
                                gridHtml += `</div>`;
                                box.innerHTML = gridHtml;
                            } else {
                                const mediaElement = col.isVideo
                                    ? `<video src="${col.src}" autoplay loop muted playsinline></video>`
                                    : `<img src="${col.src}" alt="Project Media">`;
                                
                                let audioHtml = '';
                                if (col.audioSrc) {
                                    audioHtml = `
                                        <audio src="${col.audioSrc}" loop></audio>
                                        <div class="audio-overlay" onclick="toggleAudio(this, event)">
                                            <div class="audio-play-btn"><div class="play-icon"></div></div>
                                        </div>
                                    `;
                                }

                                const innerClass = `media-frame-inner ${col.framedFit === 'contain' ? 'contain-fit' : ''}`;
                                box.innerHTML = col.framed ? `<div class="${innerClass}">${mediaElement}${audioHtml}</div>` : mediaElement + audioHtml;
                            }

                            const colAnn = createAnnotation(col.colTitle, col.colDescription, col.colAlign, col.colPosition);
                            if (colAnn) box.appendChild(colAnn);

                            row.appendChild(box);
                        });
                        targetContainer.appendChild(row);
                    });
                });
            }

            updateFloatingHeader(firstPageTitle || project.title, firstPageDesc || project.subtitle);
            setupDetailScrollObserver();

            // --- HOVER LOGIC ENGINE (DESKTOP ONLY) ---
            if (window.innerWidth > 768) {
                let pageContainers = container.querySelectorAll('.grid-page');
                if (pageContainers.length === 0) pageContainers = [container];

                pageContainers.forEach(page => {
                    const rows = page.querySelectorAll(':scope > .project-row');
                    rows.forEach((row, rIndex) => {
                        const boxes = row.querySelectorAll('.project-media-box');
                        boxes.forEach((box, cIndex) => {
                            if (row.classList.contains('expandable')) {
                                box.addEventListener('mouseenter', () => {
                                    if (!row.classList.contains('horizontal-only') && !row.classList.contains('sawtooth-row')) {
                                        rows.forEach((otherRow, oRIndex) => {
                                            otherRow.style.flex = (oRIndex === rIndex) ? '65' : `${35 / (rows.length - 1)}`;
                                        });
                                    }
                                    
                                    boxes.forEach((otherBox, oCIndex) => {
                                        if (row.classList.contains('sawtooth-row')) {
                                            if (oCIndex === cIndex) {
                                                otherBox.style.flex = '0 0 80%';
                                            } else {
                                                otherBox.style.flex = '1 1 0%';
                                            }
                                        } 
                                        else if (row.classList.contains('horizontal-only')) {
                                            if (oCIndex === cIndex) {
                                                const media = otherBox.querySelector('img, video');
                                                let targetWidth = 400;
                                                
                                                if (otherBox.classList.contains('grid-column')) {
                                                    targetWidth = 960; 
                                                } else if (media) {
                                                    let natW = media.naturalWidth || media.videoWidth;
                                                    let natH = media.naturalHeight || media.videoHeight;
                                                    let boxH = otherBox.clientHeight || container.clientHeight;
                                                    if (natW && natH && boxH) {
                                                        targetWidth = boxH * (natW / natH);
                                                    } else if (media.offsetWidth > 0) {
                                                        targetWidth = media.offsetWidth * 1.2;
                                                    }
                                                }
                                                otherBox.style.flex = `0 1 ${targetWidth}px`;
                                            } else {
                                                otherBox.style.flex = '1 1 0%';
                                            }
                                        } 
                                        else {
                                            otherBox.style.flex = (oCIndex === cIndex) ? '65' : `${35 / (boxes.length - 1)}`;
                                        }
                                    });
                                });
                            }
                        });

                        row.addEventListener('mouseleave', () => {
                            rows.forEach(r => {
                                if (!r.classList.contains('horizontal-only') && !r.classList.contains('sawtooth-row')) {
                                    r.style.flex = '1 1 0%';
                                }
                                r.querySelectorAll('.project-media-box').forEach(b => b.style.flex = '1 1 0%');
                            });
                        });
                    });
                });
            }

            switchView('detailView');
        }

        window.toggleAudio = function(overlayEl, event) {
            event.stopPropagation();
            const audioEl = overlayEl.previousElementSibling; 
            const btn = overlayEl.querySelector('.audio-play-btn');
            
            if (audioEl.paused) {
                audioEl.play();
                btn.innerHTML = `<div class="pause-icon"><div></div><div></div></div>`;
                overlayEl.classList.add('is-playing');
            } else {
                audioEl.pause();
                btn.innerHTML = `<div class="play-icon"></div>`;
                overlayEl.classList.remove('is-playing');
            }
        };

        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'VIDEO' || e.target.tagName === 'IMG' || e.target.closest('.editorial-strip') || e.target.closest('.project-media-box')) {
                e.preventDefault();
            }
        });

        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'VIDEO' || e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
