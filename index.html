F<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shane Wilson - Portfolio</title>
    <!-- GSAP for smooth cinematic transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Forces sharp editorial corners everywhere */
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        /* UNIFIED SINGLE SIDEBAR (60px wide) */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            z-index: 1000;
        }

        .sidebar-brand {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .sidebar-brand:hover {
            opacity: 0.7;
        }

        .sidebar-brand span {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Combined Stack for Tags */
        .sidebar-nav-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .nav-item {
            cursor: pointer;
            padding: 4px 0;
            transition: opacity 0.2s ease;
        }

        .nav-item:hover {
            opacity: 0.7;
        }

        .nav-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #777;
            font-weight: 500;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        .nav-item:hover .nav-text,
        .nav-item.active .nav-text {
            color: #38bdf8;
        }

        /* Main Content Layout adjusted for 60px single sidebar */
        .main-content {
            margin-left: 60px;
            width: calc(100vw - 60px);
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Views System */
        .view {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .view.active {
            display: block;
        }

        .view.splash-view {
            height: 100vh;
            overflow: hidden;
        }

        /* VIEW 0: Splash / Home Screen */
        .splash-container {
            width: 100%;
            height: 100vh;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background: #000;
        }

        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* VIEW 1: Editorial Full-Height Vertical Strips Layout */
        .editorial-strip-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            background: #0b0b0b;
            -ms-overflow-style: none;
            scrollbar-width: none;
            will-change: scroll-position;
        }

        .editorial-strip-container::-webkit-scrollbar {
            display: none;
        }

        .editorial-strip {
            flex: 0 0 320px;
            height: 100vh;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            transition: flex 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .editorial-strip.hide {
            display: none;
        }

        @media (min-width: 769px) {
            .editorial-strip:hover {
                flex: 0 0 450px;
            }
        }

        .editorial-strip video, 
        .editorial-strip img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 769px) {
            .editorial-strip:hover video,
            .editorial-strip:hover img {
                transform: scale(1.03);
            }
        }

        .strip-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 35px 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        @media (min-width: 769px) {
            .editorial-strip:hover .strip-caption {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .strip-number {
            font-family: "Didot", "Bodoni MT", "Times New Roman", Times, serif;
            font-size: 2.4rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 1px;
            color: #38bdf8;
            margin-bottom: 2px;
            line-height: 1;
        }

        .strip-caption h3 {
            font-size: 1.05rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 6px;
        }

        .strip-caption p {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
        }

        /* VIEW 2A: Standard Project Detail View (Multi-row Vertical Snap Scroll) */
        .detail-view-container {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            background: #000;
            position: relative;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .detail-view-container::-webkit-scrollbar {
            display: none;
        }

        /* VIEW 2B: Sawtooth 4-Column Expanding Horizontal View */
        .sawtooth-view-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            background: #000;
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
            will-change: scroll-position;
        }

        .sawtooth-view-container::-webkit-scrollbar {
            display: none;
        }

        .sawtooth-column {
            flex: 0 0 25vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #000;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            transition: flex 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 769px) {
            .sawtooth-column:hover {
                flex: 0 0 80vw;
            }
        }

        .sawtooth-column video,
        .sawtooth-column img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* PER-PAGE / ROW ANNOTATION BADGE */
        .page-annotation {
            position: absolute;
            bottom: 30px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            pointer-events: none;
        }
        .page-annotation.align-left {
            left: 40px;
        }
        .page-annotation.align-right {
            right: 40px;
        }
        .detail-view-container.light-mode .page-annotation {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: rgba(0, 0, 0, 0.2);
        }

        /* STANDARD DARK ROW LAYOUTS (Vertical Snap Rows) */
        .detail-view-container:not(.light-mode) .project-row {
            display: flex;
            width: 100%;
            height: 100vh;
            flex: 0 0 100vh;
            background: #000;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-media-box {
            flex: 1 1 0;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-media-box.framed {
            padding: 40px;
            background: #050505;
        }

        .project-media-box video,
        .project-media-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ============================================================
           STRICTLY SCOPED LIGHT MODE / SHOW ILLUSTRATIONS OVERRIDES
           ============================================================ */
        .detail-view-container.light-mode {
            background: #ffffff;
            height: 100vh;
            overflow-y: auto;
            display: block;
            scroll-snap-type: y mandatory;
        }

        /* Snap Wrapper for Each 100vh Page of the Grid */
        .grid-page {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .detail-view-container.light-mode .project-row {
            display: flex;
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            height: auto;
            background: #ffffff;
            border-bottom: none;
            position: relative;
            transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .detail-view-container.light-mode .project-media-box {
            background: #ffffff;
            min-height: 0;
            border-right: none;
            padding: 4px;
        }

        .detail-view-container.light-mode .project-media-box img,
        .detail-view-container.light-mode .project-media-box video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center center;
        }

        .detail-view-container.light-mode .project-media-box:hover {
            z-index: 10;
        }

        /* Mobile Adaptations */
        @media (max-width: 768px) {
            html, body {
                width: 100vw;
                height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 60px;
                flex-direction: row;
                padding: 0 20px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                z-index: 2000;
                background-color: rgba(10, 10, 10, 0.98);
            }
            .sidebar-nav-stack {
                flex-direction: row;
                gap: 15px;
            }
            .nav-text, .sidebar-brand {
                writing-mode: horizontal-tb;
                transform: none;
            }
            .main-content {
                margin-left: 0;
                margin-top: 60px;
                width: 100vw;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
                position: relative;
                overflow-y: auto;
            }
            .view {
                width: 100vw;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
                position: absolute;
                top: 0;
                left: 0;
                padding-top: 0;
            }
            .view.splash-view {
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
            }
            .splash-container {
                width: 100vw;
                height: 100%;
            }
            .editorial-strip-container {
                flex-direction: column;
                height: 100%;
                overflow-x: hidden;
                overflow-y: scroll;
                scroll-snap-type: y mandatory;
            }
            .editorial-strip {
                flex: 0 0 calc(100vh - 60px);
                flex: 0 0 calc(100dvh - 60px);
                width: 100vw;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
                scroll-snap-align: start;
                scroll-snap-stop: always;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
            .editorial-strip video, 
            .editorial-strip img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .strip-caption {
                opacity: 1;
                transform: translateY(0);
                padding: 20px 20px 25px 20px;
                background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, transparent);
                bottom: 0;
            }
            .sawtooth-view-container {
                flex-direction: column;
                height: 100%;
                overflow-x: hidden;
                overflow-y: scroll;
                scroll-snap-type: y mandatory;
            }
            .sawtooth-column {
                flex: 0 0 calc(100vh - 60px);
                flex: 0 0 calc(100dvh - 60px);
                width: 100vw;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
                scroll-snap-align: start;
                scroll-snap-stop: always;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
            .sawtooth-column video,
            .sawtooth-column img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            
            /* MOBILE: DEFAULT DARK PROJECTS */
            .detail-view-container:not(.light-mode) .project-row {
                flex-direction: column;
                height: auto;
            }
            .project-media-box,
            .project-media-box.framed {
                width: 100vw;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
                padding: 0;
                scroll-snap-align: start;
                scroll-snap-stop: always;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                flex: 0 0 calc(100vh - 60px) !important;
                flex: 0 0 calc(100dvh - 60px) !important;
            }
            .project-media-box video,
            .project-media-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            
            /* MOBILE: LIGHT-MODE OVERRIDES (Smooth free-scroll 4 to a page) */
            .detail-view-container.light-mode {
                overflow-y: auto !important;
                scroll-snap-type: none !important;
                display: block;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
            }

            .detail-view-container.light-mode .grid-page {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                width: 100vw !important;
                height: auto !important;
                min-height: calc(100vh - 60px);
                scroll-snap-align: none !important;
            }

            .detail-view-container.light-mode .project-row {
                display: contents !important; 
            }

            .detail-view-container.light-mode .project-media-box:not(.mobile-feature) {
                display: none !important;
            }

            .detail-view-container.light-mode .project-media-box.mobile-feature {
                width: 50vw !important;
                flex: 0 0 50vw !important;
                height: 40vh !important;
                border: none !important; 
                scroll-snap-align: none !important;
                padding: 10px !important;
            }

            .detail-view-container.light-mode .project-media-box:hover {
                transform: none !important;
            }

            .detail-view-container.light-mode .project-media-box img {
                object-fit: contain !important;
            }

            .page-annotation {
                bottom: 20px;
                padding: 6px 12px;
                font-size: 0.65rem;
            }
            .page-annotation.align-left {
                left: 20px;
            }
            .page-annotation.align-right {
                right: 20px;
            }
        }
    </style>
</head>

        let activeProject = null;

        function renderEditorialStrips(filterCategory = 'all') {
            const container = document.getElementById('editorialContainer');
            container.innerHTML = '';

            let counter = 1;
            projects.forEach(project => {
                if (filterCategory === 'all' || project.categories.includes(filterCategory)) {
                    const strip = document.createElement('div');
                    strip.className = 'editorial-strip';
                    strip.setAttribute('data-category', project.categories.join(' '));
                    strip.onclick = () => openProject(project.id);

                    const mediaElement = project.thumbIsVideo
                        ? `<video src="${project.thumbSrc}" autoplay loop muted playsinline></video>`
                        : `<img src="${project.thumbSrc}" alt="${project.title}">`;

                    const formattedNum = String(counter).padStart(2, '0');

                    strip.innerHTML = `
                        ${mediaElement}
                        <div class="strip-caption">
                            <h4 class="strip-number">${formattedNum}</h4>
                            <h3>${project.title}</h3>
                            <p>${project.subtitle}</p>
                        </div>
                    `;
                    container.appendChild(strip);
                    counter++;
                }
            });
        }

        // Reusable Inertial Smooth Wheel Scroll Engine
        function makeInertialScrollable(container) {
            if (!container || container._hasInertial) return;
            container._hasInertial = true;

            let targetScroll = container.scrollLeft;
            let currentScroll = container.scrollLeft;
            let isScrolling = false;

            container.addEventListener('wheel', (evt) => {
                if (window.innerWidth > 768 && (evt.deltaX !== 0 || evt.deltaY !== 0)) {
                    if (Math.abs(container.scrollLeft - currentScroll) > 5) {
                        targetScroll = container.scrollLeft;
                        currentScroll = container.scrollLeft;
                    }

                    evt.preventDefault();
                    
                    const scrollDelta = evt.deltaX !== 0 ? evt.deltaX : evt.deltaY;
                    targetScroll += scrollDelta * 0.8;
                    targetScroll = Math.max(0, Math.min(targetScroll, container.scrollWidth - container.clientWidth));

                    if (!isScrolling) {
                        isScrolling = true;
                        requestAnimationFrame(updateScroll);
                    }
                }
            }, { passive: false });

            function updateScroll() {
                currentScroll += (targetScroll - currentScroll) * 0.08;
                container.scrollLeft = currentScroll;

                if (Math.abs(targetScroll - currentScroll) > 0.3) {
                    requestAnimationFrame(updateScroll);
                } else {
                    isScrolling = false;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderEditorialStrips('all');
            makeInertialScrollable(document.getElementById('editorialContainer'));
        });

        function switchView(viewId) {
            const currentActive = document.querySelector('.view.active');
            const targetView = document.getElementById(viewId);

            if (currentActive === targetView) return;

            if (viewId !== 'detailView') {
                activeProject = null;
            }

            gsap.to(currentActive, {
                opacity: 0,
                duration: 0.2,
                onComplete: () => {
                    currentActive.classList.remove('active');
                    targetView.classList.add('active');
                    gsap.fromTo(targetView, { opacity: 0 }, { opacity: 1, duration: 0.4 });
                    
                    window.scrollTo(0, 0);
                    if (viewId === 'detailView' && activeProject) {
                        const detailContainer = document.getElementById('detailContainer');
                        if (detailContainer) detailContainer.scrollTop = 0;
                    } else if (viewId === 'projectsView') {
                        const edContainer = document.getElementById('editorialContainer');
                        if (edContainer) edContainer.scrollLeft = 0;
                    }
                }
            });
        }

        function filterStrips(category, element) {
            switchView('projectsView');

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            renderEditorialStrips(category);
            const edContainer = document.getElementById('editorialContainer');
            if (edContainer) edContainer.scrollLeft = 0;
        }

        function openProject(projectId) {
            const project = projects.find(p => p.id === projectId) || projects[0];
            activeProject = project;
            const container = document.getElementById('detailContainer');
            
            container.innerHTML = '';
            container.className = '';

            if (project.isSawtooth) {
                container.className = 'sawtooth-view-container';
                
                project.columns.forEach(col => {
                    const colDiv = document.createElement('div');
                    colDiv.className = 'sawtooth-column';
                    
                    const mediaEl = col.isVideo
                        ? `<video src="${col.src}" autoplay loop muted playsinline></video>`
                        : `<img src="${col.src}" alt="Sawtooth Media">`;

                    colDiv.innerHTML = mediaEl;
                    container.appendChild(colDiv);
                });

                makeInertialScrollable(container);

            } else {
                container.className = 'detail-view-container';
                if (project.lightBg) {
                    container.classList.add('light-mode');
                }
                
                let activePages = project.pages;
                if (project.lightBg && window.innerWidth <= 768) {
                    let mobileItems = [];
                    project.pages.forEach(p => {
                        p.rows.forEach(r => {
                            r.cols.forEach(c => {
                                if (c.mobileFeature) mobileItems.push(c);
                            });
                        });
                    });

                    let chunkedPages = [];
                    for (let i = 0; i < mobileItems.length; i += 4) {
                        let chunk = mobileItems.slice(i, i + 4);
                        chunkedPages.push({
                            pageTitle: `PAGE ${Math.floor(i/4) + 1}`,
                            titleAlign: 'left',
                            rows: [
                                { expandable: false, cols: chunk.slice(0, 2) },
                                { expandable: false, cols: chunk.slice(2, 4) }
                            ]
                        });
                    }
                    activePages = chunkedPages;
                }

                if (activePages) {
                    activePages.forEach(page => {
                        const pageWrapper = document.createElement('div');
                        pageWrapper.className = 'grid-page';

                        if (page.pageTitle) {
                            const annotation = document.createElement('div');
                            annotation.className = `page-annotation ${page.titleAlign === 'right' ? 'align-right' : 'align-left'}`;
                            annotation.innerText = page.pageTitle;
                            pageWrapper.appendChild(annotation);
                        }
                        
                        page.rows.forEach(rowObj => {
                            const row = document.createElement('div');
                            row.className = 'project-row' + (rowObj.expandable ? ' expandable' : '');
                            
                            rowObj.cols.forEach(col => {
                                const box = document.createElement('div');
                                box.className = `project-media-box ${col.framed ? 'framed' : ''}`;
                                
                                if (col.mobileFeature) {
                                    box.classList.add('mobile-feature');
                                }

                                const mediaElement = col.isVideo
                                    ? `<video src="${col.src}" autoplay loop muted playsinline></video>`
                                    : `<img src="${col.src}" alt="Project Media">`;
                                box.innerHTML = mediaElement;
                                row.appendChild(box);
                            });
                            pageWrapper.appendChild(row);
                        });
                        container.appendChild(pageWrapper);
                    });
                } else if (project.rows) {
                    project.rows.forEach(rowObj => {
                        const row = document.createElement('div');
                        row.className = 'project-row' + (rowObj.expandable ? ' expandable' : '');

                        if (rowObj.pageTitle) {
                            const annotation = document.createElement('div');
                            annotation.className = `page-annotation ${rowObj.titleAlign === 'right' ? 'align-right' : 'align-left'}`;
                            annotation.innerText = rowObj.pageTitle;
                            row.appendChild(annotation);
                        }
                        
                        rowObj.cols.forEach(col => {
                            const box = document.createElement('div');
                            box.className = `project-media-box ${col.framed ? 'framed' : ''}`;
                            const mediaElement = col.isVideo
                                ? `<video src="${col.src}" autoplay loop muted playsinline></video>`
                                : `<img src="${col.src}" alt="Project Media">`;
                            box.innerHTML = mediaElement;
                            row.appendChild(box);
                        });
                        container.appendChild(row);
                    });
                }

                const blocksToIterate = project.pages ? container.querySelectorAll('.grid-page') : [container];
                
                blocksToIterate.forEach(block => {
                    const rows = block.querySelectorAll('.project-row');
                    rows.forEach((row, rIndex) => {
                        const boxes = row.querySelectorAll('.project-media-box');
                        boxes.forEach((box, cIndex) => {
                            if (row.classList.contains('expandable')) {
                                box.addEventListener('mouseenter', () => {
                                    rows.forEach((otherRow, oRIndex) => {
                                        otherRow.style.flex = (oRIndex === rIndex) ? '65' : `${35 / (rows.length - 1)}`;
                                    });
                                    boxes.forEach((otherBox, oCIndex) => {
                                        otherBox.style.flex = (oCIndex === cIndex) ? '65' : `${35 / (boxes.length - 1)}`;
                                    });
                                });
                            }
                        });

                        row.addEventListener('mouseleave', () => {
                            rows.forEach(r => {
                                r.style.flex = '1 1 0';
                                r.querySelectorAll('.project-media-box').forEach(b => b.style.flex = '1 1 0');
                            });
                        });
                    });
                });
            }

            switchView('detailView');
        }

        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'VIDEO' || e.target.tagName === 'IMG' || e.target.closest('.editorial-strip') || e.target.closest('.project-media-box') || e.target.closest('.sawtooth-column')) {
                e.preventDefault();
            }
        });

        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'VIDEO' || e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
