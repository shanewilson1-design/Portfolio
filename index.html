<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shane Wilson - Character Turnaround Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Forces sharp corners everywhere */
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        /* Slim Vertical Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 100vh;
            background-color: rgba(12, 12, 12, 0.95);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            z-index: 1000;
            cursor: pointer;
        }

        .sidebar-menu-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .sidebar:hover .sidebar-menu-label {
            color: #38bdf8;
        }

        /* Non-interactive brand text at the bottom */
        .sidebar-brand {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            cursor: default;
        }

        .sidebar-brand span {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Slide-out Menu Overlay & Panel */
        .menu-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-popup-overlay.active {
            display: block;
            opacity: 1;
        }

        .menu-slide-panel {
            position: fixed;
            top: 0;
            left: 60px;
            width: 280px;
            height: 100vh;
            background: rgba(18, 18, 18, 0.98);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            z-index: 3001;
        }

        .menu-popup-overlay.active .menu-slide-panel {
            transform: translateX(0);
        }

        .menu-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .menu-panel-header h2 {
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #38bdf8;
            font-weight: 700;
        }

        .menu-panel-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .menu-panel-close:hover {
            color: #fff;
        }

        .menu-panel-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-panel-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .menu-panel-links a:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }

        /* Main Content Layout */
        .main-content {
            margin-left: 60px;
            width: calc(100vw - 60px);
            height: 100vh;
        }

        .section {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            height: 100vh;
            gap: 0;
        }

        .media-box {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-box video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* Desktop Only: 40px inset border framing exclusively on the closeup side */
        @media (min-width: 769px) {
            .media-box.closeup-framed {
                padding: 40px;
                background-color: #000;
            }
            .media-box.closeup-framed video {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }

        /* Mobile Viewport Adaptations */
        @media (max-width: 768px) {
            html, body {
                height: 100vh;
                height: 100dvh;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 60px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 0 20px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                z-index: 2000;
            }

            .sidebar-menu-label {
                writing-mode: horizontal-tb;
                transform: none;
                font-size: 0.9rem;
                letter-spacing: 2px;
            }

            .sidebar-brand {
                writing-mode: horizontal-tb;
                transform: none;
            }

            .sidebar-brand span {
                font-size: 0.85rem;
                letter-spacing: 1px;
            }

            .menu-slide-panel {
                top: 60px;
                left: 0;
                width: 100vw;
                height: calc(100vh - 60px);
                height: calc(100dvh - 60px);
                transform: translateY(-100%);
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .menu-popup-overlay.active .menu-slide-panel {
                transform: translateY(0);
            }

            .main-content {
                margin-left: 0;
                width: 100vw;
                height: auto;
            }

            .section {
                height: auto;
                min-height: auto;
                display: block;
                scroll-snap-align: none;
            }

            .grid-container {
                display: flex;
                flex-direction: column;
                width: 100vw;
                height: auto;
            }

            .media-box, 
            .media-box.closeup-framed {
                padding: 0;
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                scroll-snap-align: start;
                scroll-snap-stop: always;
                flex-shrink: 0;
            }

            .media-box video,
            .media-box.closeup-framed video {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <!-- Slim Sidebar with Vertical MENU at top and non-interactive Shane Wilson at bottom -->
    <aside class="sidebar" onclick="toggleMenuPopup()">
        <div class="sidebar-menu-label">MENU</div>
        <div class="sidebar-brand">
            <span>Shane Wilson</span>
        </div>
    </aside>

    <!-- Slide-out Section Navigation Panel -->
    <div class="menu-popup-overlay" id="menuPopup" onclick="handleOverlayClick(event)">
        <div class="menu-slide-panel">
            <div class="menu-panel-header">
                <h2>Sections</h2>
                <button class="menu-panel-close" onclick="toggleMenuPopup()">&times;</button>
            </div>
            <div class="menu-panel-links">
                <a href="#char1" onclick="toggleMenuPopup()">Green Fringe</a>
                <a href="#char2" onclick="toggleMenuPopup()">Mirror</a>
                <a href="#char3" onclick="toggleMenuPopup()">Silver Fringe</a>
            </div>
        </div>
    </div>

    <!-- Main Portfolio Content -->
    <main class="main-content">

        <!-- Green Fringe Section -->
        <section id="char1" class="section">
            <div class="grid-container">
                <div class="media-box">
                    <video src="https://shanewilson1-design.github.io/Portfolio/Video/HS_Mirror_Closeup-001.mp4" autoplay loop muted playsinline></video>
                </div>
                <div class="media-box closeup-framed">
                    <video src="https://shanewilson1-design.github.io/Portfolio/Video/HS_GreenFringe_Closeup-001.mp4" autoplay loop muted playsinline></video>
                </div>
            </div>
        </section>

        <!-- Mirror Section -->
        <section id="char2" class="section">
            <div class="grid-container">
                <div class="media-box closeup-framed">
                    <video src="Video/HS_Mirror_Closeup-001.mp4" autoplay loop muted playsinline></video>
                </div>
                <div class="media-box">
                    <video src="Video/HS_Mirror_Full-001.mp4" autoplay loop muted playsinline></video>
                </div>
            </div>
        </section>

        <!-- Silver Fringe Section -->
        <section id="char3" class="section">
            <div class="grid-container">
                <div class="media-box">
                    <video src="Video/HS_GreenFringe_Full-001.mp4" autoplay loop muted playsinline></video>
                </div>
                <div class="media-box closeup-framed">
                    <video src="Video/HS_SilverFringe_Closeup-001.mp4" autoplay loop muted playsinline></video>
                </div>
            </div>
        </section>

    </main>

    <script>
        function toggleMenuPopup() {
            const popup = document.getElementById('menuPopup');
            popup.classList.toggle('active');
        }

        function handleOverlayClick(event) {
            const popup = document.getElementById('menuPopup');
            if (event.target === popup) {
                popup.classList.remove('active');
            }
        }
    </script>

</body>
</html>
